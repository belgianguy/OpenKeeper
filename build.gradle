import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
}

ext {
    jmonkeyengine_version = '3.9.0-stable'
    license = file("$rootDir/license.txt")
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url = "https://jitpack.io" }
    }
}

application {
    applicationName = 'OpenKeeper'
    mainClass = 'toniarts.openkeeper.Main'
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        applicationDefaultJvmArgs = ["-Dvisualvm.display.name=OpenKeeper", "-XstartOnFirstThread"]
    }
    else {
        applicationDefaultJvmArgs = ["-Dvisualvm.display.name=OpenKeeper"]
    }    
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.github.nifty-gui:nifty') using module('com.github.tonihele.nifty-gui:nifty:1.4-SNAPSHOT')
        substitute module('com.github.nifty-gui:nifty-default-controls') using module('com.github.tonihele.nifty-gui:nifty-default-controls:1.4-SNAPSHOT')
        substitute module('com.github.nifty-gui:nifty-style-black') using module('com.github.tonihele.nifty-gui:nifty-style-black:1.4-SNAPSHOT')
    }
}

project(":assets") {
    apply plugin: "java"

    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("assets"))

    sourceSets {
        main {
            resources {
                srcDir(".")
                exclude("Converted/**")
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    implementation "org.jmonkeyengine:jme3-core:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-desktop:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-plugins:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-effects:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-networking:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-niftygui:$jmonkeyengine_version"
    implementation "com.badlogicgames.gdx:gdx-ai:1.8.2"
    implementation "javax.vecmath:vecmath:1.5.2"
    implementation "com.simsilica:zay-es:1.6.0"
    implementation "com.simsilica:zay-es-net:1.6.0"
    implementation "com.simsilica:sio2:1.8.0"
    implementation "com.simsilica:sim-ethereal:1.8.0"

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Assets sub-project
    runtimeOnly project(':assets')
}

test {
    useJUnitPlatform()
    if (System.getProperty("openkeeper.dk2.root") != null) {
        systemProperty "openkeeper.dk2.root", System.getProperty("openkeeper.dk2.root")
    }
}

tasks.register("generateMaterialShowcaseMap", JavaExec) {
    group = "verification"
    description = "Generate MaterialShowcase in the configured Dungeon Keeper 2 editor maps folder"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "toniarts.openkeeper.tools.convert.map.MaterialShowcaseMapGenerator"
    def dk2Root = providers.systemProperty("openkeeper.dk2.root")
    doFirst {
        if (!dk2Root.isPresent()) {
            throw new GradleException("Pass -Dopenkeeper.dk2.root=/path/to/Dungeon\\ Keeper\\ 2")
        }
        args dk2Root.get()
    }
}

tasks.register("validateMaterialShowcaseMap", JavaExec) {
    group = "verification"
    description = "Parse and validate MaterialShowcase from the configured Dungeon Keeper 2 folder"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "toniarts.openkeeper.tools.convert.map.MaterialShowcaseMapGenerator"
    def dk2Root = providers.systemProperty("openkeeper.dk2.root")
    doFirst {
        if (!dk2Root.isPresent()) {
            throw new GradleException("Pass -Dopenkeeper.dk2.root=/path/to/Dungeon\\ Keeper\\ 2")
        }
        args dk2Root.get(), "--validate"
    }
}

tasks.register("generatePortalGemCampaignMap", JavaExec) {
    group = "verification"
    description = "Generate PortalGemCampaign in the configured Dungeon Keeper 2 editor maps folder"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "toniarts.openkeeper.tools.convert.map.PortalGemCampaignMapGenerator"
    def dk2Root = providers.systemProperty("openkeeper.dk2.root")
    doFirst {
        if (!dk2Root.isPresent()) {
            throw new GradleException("Pass -Dopenkeeper.dk2.root=/path/to/Dungeon\\ Keeper\\ 2")
        }
        args dk2Root.get()
    }
}

tasks.register("validatePortalGemCampaignMap", JavaExec) {
    group = "verification"
    description = "Parse and validate PortalGemCampaign from the configured Dungeon Keeper 2 folder"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "toniarts.openkeeper.tools.convert.map.PortalGemCampaignMapGenerator"
    def dk2Root = providers.systemProperty("openkeeper.dk2.root")
    doFirst {
        if (!dk2Root.isPresent()) {
            throw new GradleException("Pass -Dopenkeeper.dk2.root=/path/to/Dungeon\\ Keeper\\ 2")
        }
        args dk2Root.get(), "--validate"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Class-Path': configurations.runtimeClasspath.files.collect { it.getName() }.join(' '),
            'Main-Class': application.mainClass,
            'Built-By': System.properties['user.name'],
            'Build-Timestamp': new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
            'Created-By': "Gradle ${gradle.gradleVersion}",
            'Build-JDK': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
            'Build-OS': "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
        )
    }
}

eclipse {
    classpath {
        downloadSources=true
    }
    project {
        natures 'org.springsource.ide.eclipse.gradle.core.nature'
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

compileJava {
    // We have annotation processors in log4j, only needed for writing plugins, disable the warnings
    options.compilerArgs += ["-proc:none"]
    options.compilerArgs += ["-Xlint:deprecation"]
    //options.compilerArgs += ["-Xlint:unchecked"]
}

wrapper {
    gradleVersion = '9.6.1'
}
